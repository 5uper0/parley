name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read
  # The poll step below filters statusCheckRollup on .workflowName, which resolves
  # checkSuite.workflowRun in the GraphQL schema. A Dependabot-triggered run gets a
  # scope-capped token, so without actions: read that field is not readable and the
  # query fails. Never observed here, because every Dependabot PR so far has been a
  # major bump and the step skipped, but it would bite the first patch/minor one.
  actions: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Wait for other checks, then merge patch/minor
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # No branch protection available on this plan, so GitHub's native
          # --auto merge (which requires it) is not usable. Poll sibling
          # checks ourselves (excluding this workflow's own run) and merge
          # directly once they're all green. Give up after ~10 minutes.
          for i in $(seq 1 40); do
            STATE=$(gh pr view "$PR_URL" --json statusCheckRollup --jq '
              [.statusCheckRollup[]? | select(.workflowName != "Dependabot auto-merge")] as $c
              | if ($c | length) == 0 then "ready"
                elif ($c | any(.status? == "IN_PROGRESS" or .status? == "QUEUED" or .status? == "PENDING" or .state? == "PENDING")) then "pending"
                elif ($c | any(.conclusion? == "FAILURE" or .conclusion? == "TIMED_OUT" or .conclusion? == "CANCELLED" or .state? == "FAILURE" or .state? == "ERROR")) then "failed"
                else "ready" end
            ')
            echo "poll $i: $STATE"
            if [ "$STATE" = "ready" ]; then
              gh pr merge --squash "$PR_URL"
              exit 0
            elif [ "$STATE" = "failed" ]; then
              echo "a sibling check failed — leaving for manual review"
              exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for checks — leaving for manual review"
