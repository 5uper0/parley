name: deploy-demo

# parleyprotocol.com is a static pre-render of landing/ (root) + examples/demo/ (/demo/), merged
# by scripts/build-site.sh into one Cloudflare Pages tree. Pages replaces the whole tree on every
# deploy, so both halves must always ship together — this workflow fires on either changing.
# Without this the site drifted behind main silently: PR #43 added a seventh scenario that the
# live API kept serving six of, because the only way to publish was a human running the build
# locally.
on:
  push:
    branches: [main]
    paths:
      - "examples/demo/**"
      - "landing/**"
      - "scripts/build-static-demo.py"
      - "scripts/build-site.sh"
      - "docs/brand/assets/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PARLEY_GA4_ID: ${{ vars.PARLEY_GA4_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install landing dependencies
        run: npm --prefix landing ci
      - name: Build the merged site (landing at /, demo at /demo/)
        run: scripts/build-site.sh build/site
      - name: Check the build is complete
        run: |
          test -f build/site/index.html
          test -f build/site/demo/index.html
          test -f build/site/demo/api/recipes.json
          # every whitelisted recipe must have a baked response
          python - <<'PY'
          import json, pathlib
          keys = [r["key"] for r in json.loads(pathlib.Path("build/site/demo/api/recipes.json").read_text())]
          missing = [k for k in keys if not pathlib.Path(f"build/site/demo/api/run/{k}.json").exists()]
          assert not missing, f"missing baked responses: {missing}"
          print(f"{len(keys)} scenarios baked")
          PY
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy build/site --project-name=parley-demo --branch=main
      - name: Report skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Built successfully but did not deploy — CLOUDFLARE_API_TOKEN is not set."
          echo "Add the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deploys."
