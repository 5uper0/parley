name = "parley-room-relay"
main = "worker.mjs"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMIT"
class_name = "Limiter"

[[durable_objects.bindings]]
name = "MLIMIT"
class_name = "MetricsLimiter"

[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "Counters"

[[durable_objects.bindings]]
name = "RECORDS"
class_name = "Records"

# No request logs and no traces: /m must leave nothing but a counter.
[observability]
enabled = false

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Limiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MetricsLimiter", "Counters"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Records"]
